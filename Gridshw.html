<!DOCTYPE html>
<html>
     <head>
         <title>Bootstrap</title>
         <link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
         <style>
            .col-xl {
                text-align: center;
                border: 1px solid rgb(80, 4, 4);
            }
            .col-l {
                text-align: center;
                border: 3px solid rgb(9, 5, 5);
            }
            .col-md {
                text-align: center;
                border: 5px solid rgb(232, 22, 22);
            }
            .col-sm {
                text-align: center;
                border: 6.7px solid rgb(30, 160, 50);
            }
            
            

         </style>
     </head>
     <body>
        <div class="container">
            <div class="row">
                <div class="col-xl">
                    I am Prad
                </div>
                <div class="col-l">
                    I am 11
                </div>
                <div class="col-md">
                    I live in Australia
                </div>
                <div class="col-sm">
                  Where do you live

                </div>
            </div>
            
     </body>
</html>
