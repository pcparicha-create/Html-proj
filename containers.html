<!DOCTYPE html>
<html>
    <head>
        <title>Containers</title>
        <link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <h1>Containers</h1>
        <div class="container bg-primary text-white py-400 mb-300" >
            <p>This is a container class which provides us a full width container.</p>
        </div>
        <div class="container-fluid bg-danger px-400 my-300 text-blue">
            <p>This is a fluid container which takes the entire shape of the screen.</p>
        </div>
    </body>
</html>
