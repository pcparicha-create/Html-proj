<!DOCTYPE html>
<html>
    <head>
        <title>Corousel</title>
        <link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <h1>Corousel</h1>
        <div id="myCarousel" class="carousel slide" data-bs-ride="corousel">
            <div class="carousel-indicators">
                <button data-bs-target="#myCarousel" data-bs-slided-to="0" class="active"></button>
                <button data-bs-target="#myCarousel" data-bs-slided-to="1"></button>
                <button data-bs-target="#myCarousel" data-bs-slided-to="2"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Virat-Kohli-India-celebrates-50th-century-Cricket-November-15-2023.webp" class="d-block w-80">
                </div>
                <div class="carousel-item ">
                    <img src="Virat-Kohli-India-celebrates-50th-century-Cricket-November-15-2023.webp" class="d-block w-80">
                </div>
                <div class="carousel-item ">
                    <img src="Virat-Kohli-India-celebrates-50th-century-Cricket-November-15-2023.webp" class="d-block w-80">
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
             
        </script>
    </body>
</html>
