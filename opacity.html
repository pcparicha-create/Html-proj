<!DOCTYPE html>
<html>
    <head>
        <title>
            Opacity
        </title>
        <style>
            div.twof {
                opacity: 0.25;
            }
            div.half {
                opacity: 0.50;
            }
            div.threef {
                opacity: 0.75;
            }
        </style>
    </head>
    <body>
        <div class="twof" style="background-color: rgb(31, 114, 6);"><p>opacity= 0.25</p></div>
        <div class="half" style="background-color: rgb(31, 114, 6);"><p>opacity= 0.50</p></div>
        <div class="threef" style="background-color: rgb(31, 114, 6);"><p>opacity= 0.75</p></div>
        <div class="full" style="background-color: rgb(31, 114, 6);"><p>opacity= 1</p></div>
    </body>
</html>
