<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes Cascading {
                0% {background-color: aquamarine;}
                10% {background-color: aqua;}
                20% {background-color: rgb(58, 186, 241);}
                40% {background-color: rgb(26, 20, 227);}
                67% {background-color: rgb(133, 115, 196);}
                75% {background-color: rgb(178, 21, 231);}
                85% {background-color: rgb(187, 15, 181);}
                93% {background-color: rgb(237, 28, 129);}
                100% {background-color: red;}

            }
            div {
                height: 200px;
                width: 200px;
                background-position: center;
                animation-name: Cascading;
                animation-duration: 10s;
                background-color: aquamarine;
            }
        </style>
    </head>
    <body>
        <div>Cascading Effect</div>
    </body>
</html>
