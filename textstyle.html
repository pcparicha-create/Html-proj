<!DOCTYPE html>
<html>
    <head>
        <title>text style</title>
        <style>
            p {
                color: blueviolet;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                text-decoration:double;
                text-transform:capitalize;
            }
            #try {
                color: rgb(208, 30, 83);
                font-size: 30px;
                text-decoration:line-through;
                text-transform:initial;
                text-shadow: 3px 4px 5px seagreen;
            }
            div {
                height: 200px;
                width: 200px;
                background-color: blue;
                box-shadow: 10px 9px 4px lightcoral;

                
            }
            #more {
                height: 200px;
                width: 200px;
                background-color: blue;
                transform: rotate(180deg);
                text-indent: 67% red;
            }
            #last {
                text-decoration: underline;
                text-transform: uppercase;
            }
            #once {
                text-decoration: overline;
                text-transform: lowercase;
            }
        </style>
    </head>
    <body>
        <p>hello!</p><br>
        <p id="try">my name is...</p><br>
        <p id="once">Pradyumna</p><br>
        <p id="last">Paricha</p>
        <div>rotate</div><br>
        <div id="more">rotate</div>

    </body>
</html>
