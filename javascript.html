<!DOCTYPE html>
<html>
    <head>
        <title>basics</title>
    </head>
    <body>
        <h1>basics</h1>
        <p id="par"></p>
        <p id="variables"></p>
        <p id="ops+sen"></p>

        <script>
            //syntax
            document.getElementById("par").innerHTML="My name is Pradyumna";
            // variables
            var x = 21;
            var y = 67;
            var sum = x+y;
            document.getElementById("variables").innerHTML="The ans to the sum is- " + sum;
            // statements + operators
            var a = 24*6;
            var b = 400/4;
            var c = 35+2;
            var d = 69-2;
            var ans = a*d+1-c/b
            document.getElementById("ops+sen").innerHTML="the ans to this equation is- " +ans;


        </script>
    </body>
</html>
