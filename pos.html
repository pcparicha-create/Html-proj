<!DOCTYPE html>
<html>
    <head>
        <title>Positioning</title>
        <style>
            div.static {
                position: static;
                border: 5px solid black;
            }
            div.What {
                background-color: white;
                height:1100px;
            }
            div.fixed {
                position: fixed;
                border: 5px solid black;

            }
            div.relative {
                position: relative;
                border: 5px solid black;

            }
            div.abs {
                position:absolute;
                border: 5px solid black;

            }
            div.sticky {
                position: sticky;
                border: 5px solid black;
            }
        </style>
    </head>
    <Body>
        <h2>Pos</h2>
        <div class="fixed">fixed</div>
        <div class="static">static</div>
        <div class="relative">
            relative
            <div class="abs">absolute</div>
        </div><br>
        <div class="sticky">sticky</div>
        <div class="What"></div>
        
    </Body>
</html>
